name: imd_portal
description: "A native Flutter dashboard app for India Meteorological Department (IMD) employees."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Cookie Session Handling
  http: ^1.2.0

  # HTML Scraping
  html: ^0.15.4

  # Cryptography (RSA PKCS1_v1_5 matching PyCryptodome)
  pointycastle: ^3.7.4
  encrypt: ^5.0.3

  # Local Persistence
  shared_preferences: ^2.2.2

  # Date and Time Formatting
  intl: ^0.19.0

  # Native Android Background Workers & Notifications
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.0.0

  # Android Home Screen Widgets
  home_widget: ^0.6.0

  # URL Launcher to open circular PDF links
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
