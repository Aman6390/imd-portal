name: imd_portal
description: "A native Flutter dashboard app for meteorological staff and employees."
publish_to: "none"
version: 1.4.0+17

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Cookie Session Handling
  http: ^1.2.0

  # HTML Scraping
  html: ^0.15.4

  # Cryptography (RSA PKCS1_v1_5 matching PyCryptodome)
  pointycastle: ^3.7.4
  encrypt: ^5.0.3

  # Local Persistence
  shared_preferences: ^2.2.2

  # Date and Time Formatting
  intl: ^0.19.0

  # Native Android Background Workers & Notifications
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.0.0

  # Android Home Screen Widgets
  home_widget: ^0.6.0

  # URL Launcher to open circular PDF links
  url_launcher: ^6.2.4

  # Biometric and PIN authentication
  local_auth: ^2.3.0

  # File paths and temporary storage for PDF processing
  path_provider: ^2.1.2

  # On-Device Google ML Kit Text Recognition with Devanagari Hindi support
  google_mlkit_text_recognition: ^0.13.0

  # In-App Authenticated MetNet Notice Resolver WebView
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
